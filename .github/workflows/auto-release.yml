name: Auto release dependency updates

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  auto-release:
    name: Auto release version bump
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine spring-cloud-config version
        id: version
        run: |
          VERSION=$(awk '/^\[versions\]/{f=1;next} /^\[/{f=0} f && /^spring-cloud-config = /{print}' gradle/libs.versions.toml | sed -E 's/^spring-cloud-config = "([^"]+)"$/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if a release already exists for this version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "This PR did not bump spring-cloud-config (e.g. a Spring Boot or GitHub Actions only bump) - skipping release."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update README supported tags
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          {
            printf '* `%s-jre17`, `%s-jre17`, `jre17`, `%s`, `%s`, `latest`\n' "$VERSION" "$MAJOR_MINOR" "$VERSION" "$MAJOR_MINOR"
            printf '* `%s-jdk17`, `%s-jdk17`, `jdk17`\n' "$VERSION" "$MAJOR_MINOR"
            printf '* `%s-jre21`, `%s-jre21`, `jre21`\n' "$VERSION" "$MAJOR_MINOR"
            printf '* `%s-jdk21`, `%s-jdk21`, `jdk21`\n' "$VERSION" "$MAJOR_MINOR"
          } > /tmp/supported-tags.md
          awk -v block_file=/tmp/supported-tags.md '
            /^### Supported tags$/ {
              print
              while ((getline line < block_file) > 0) print line
              skip=1
              next
            }
            skip && /^$/ { skip=0 }
            skip { next }
            { print }
          ' README.md > README.md.new
          mv README.md.new README.md

      - name: Commit README update
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "Update supported tags for v${{ steps.version.outputs.version }}"
            git push origin main
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target main \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
