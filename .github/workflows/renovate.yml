name: Renovate

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        type: choice
        options:
          - info
          - debug
        default: info

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_USERNAME: spring-cloud-config-server-auto[bot]
          RENOVATE_GIT_AUTHOR: spring-cloud-config-server-auto[bot] <4693763+spring-cloud-config-server-auto[bot]@users.noreply.github.com>
