name: Build and deploy OCI image to registry

on:
  workflow_call:
    inputs:
      arch:
        description: Architecture to build (x64, arm)
        type: string
        default: x64
      image-jvm-type:
        description: JVM type for output image
        type: string
        default: jre
      image-jvm-version:
        description: JVM version for output image
        type: string
        default: 17
      image-name:
        description: The output image name
        type: string
        required: true
      java-build-distribution:
        description: Java distribution to use for build
        type: string
        default: temurin
      java-build-version:
        description: Java version to build with
        type: string
        default: 17
      registry:
        description: The registry to deploy to
        type: string
        required: true
      tags:
        description: Comma separated list of docker tags to create
        type: string

permissions:
  contents: read
  packages: write

jobs:
  generate-jvm-tag:
    uses: ./.github/workflows/generate-jvm-tag.yml
    with:
      jvm-type: ${{ inputs.image-jvm-type }}
      jvm-version: ${{ inputs.image-jvm-version }}

  build-and-push:
    name: Build and deploy ${{ inputs.arch }} OCI image
    needs: generate-jvm-tag
    runs-on: ${{ inputs.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    outputs:
      image-name: ${{ steps.outputs.outputs.image-name }}
      arch: ${{ inputs.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-build-version }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-build-distribution }}
          java-version: ${{ inputs.java-build-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Add tags environment variable
        if: inputs.tags != ''
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ inputs.tags }}"
          ARCH_TAGS=""
          for tag in "${TAG_ARRAY[@]}"; do
            tag=$(echo "$tag" | xargs)
            if [ -z "$ARCH_TAGS" ]; then
              ARCH_TAGS="${tag}-${{ inputs.arch }}"
            else
              ARCH_TAGS="${ARCH_TAGS},${tag}-${{ inputs.arch }}"
            fi
          done
          echo "DOCKER_TAGS=$ARCH_TAGS" >> $GITHUB_ENV

      - name: Setup Docker Hub credentials
        if: inputs.registry == 'docker.io'
        run: |
          echo "DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD=${{ secrets.DOCKERHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Setup GitHub Container Registry credentials
        if: inputs.registry == 'ghcr.io'
        run: |
          echo "DOCKER_USERNAME=${{ github.actor }}" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Build and deploy OCI image
        id: build
        run: >
          ./gradlew bootBuildImage
          -PjvmType=${{ inputs.image-jvm-type }}
          -PjdkVersion=${{ inputs.image-jvm-version }}
          -PdockerUsername=${{ env.DOCKER_USERNAME }}
          -PdockerPassword=${{ env.DOCKER_PASSWORD }}
          $TAGS
          -PimagePlatform=${{ inputs.arch == 'arm' && 'linux/arm64' || 'linux/amd64' }}
          --imageName="${{ inputs.registry }}/${{ inputs.image-name }}"
          --publishImage

      - name: Output image name
        id: outputs
        run: |
          echo "image-name=${{ inputs.registry }}/${{ inputs.image-name }}" >> $GITHUB_OUTPUT
