name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Docker Image Version
      description: What version/tag of the Docker image are you using?
      placeholder: e.g., 5.0.1-jre17
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Configure '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your docker-compose.yml or docker run command (remove sensitive data).
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output.
      render: shell
  - type: input
    id: docker-version
    attributes:
      label: Docker Version
      description: Output of `docker version`
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS and version are you running?
      placeholder: e.g., Ubuntu 22.04, macOS 14.0
